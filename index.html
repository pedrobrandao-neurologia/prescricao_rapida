        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* Apple glass effect */
        .apple-glass {

        }

        /* Smooth inputs */
        input, select, textarea {
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        input:focus, select:focus, textarea:focus {

        /* Apple button style */

        .apple-btn:active { transform: scale(0.98); }
        .apple-btn:disabled { background: #d2d2d7; cursor: not-allowed; }

        /* ===== ESTILOS DE IMPRESSÃO ===== */
        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            body {
                background-color: white !important;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                display: block !important;
                position: static !important;
            }
            .print-area .a4-page {
                width: 210mm;
                height: 297mm;
                padding: 20mm;
                margin: 0;
                box-shadow: none !important;
                border: none !important;
                page-break-after: always;
                page-break-inside: avoid;
                background: white;
                position: relative;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .print-area .a4-page:last-child {
                page-break-after: auto;
            }
        }

        @media screen {
            .print-area {
                display: none !important;
            }
        }

        /* Estilo da página na tela (Preview) */
        .a4-preview {
            width: 210mm;
            min-height: 297mm;
            background: white;
            padding: 20mm;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            border-radius: 18px;
            margin: 0 auto 2rem auto;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        /* Campos de controle especial */
        .box-controle {
            border: 1px solid #1d1d1f;
            padding: 8px;
            font-size: 10px;
            line-height: 1.4;
        }

        /* Preview responsivo: escala no mobile */
        @media screen and (max-width: 767px) {
            .a4-preview {
                width: 100% !important;
                min-height: auto !important;
                padding: 12mm !important;
                font-size: 13px;
            }
        }
    </style>

        const CLINICS = {

        // ========================================
        // Base CID-10 (Códigos mais comuns em Neurologia)
        // ========================================
        const CID10_DATABASE = [
            { code: 'G20', desc: 'Doença de Parkinson' },
            { code: 'G20.0', desc: 'Doença de Parkinson primária' },
            { code: 'G21', desc: 'Parkinsonismo secundário' },

            { code: 'G25', desc: 'Outros transtornos extrapiramidais e dos movimentos' },
            { code: 'G25.0', desc: 'Tremor essencial' },
            { code: 'G25.1', desc: 'Tremor induzido por drogas' },
            { code: 'G25.3', desc: 'Mioclonia' },
            { code: 'G25.5', desc: 'Coreia induzida por drogas' },
            { code: 'G25.8', desc: 'Outros transtornos extrapiramidais e dos movimentos especificados' },
            { code: 'G30', desc: 'Doença de Alzheimer' },
            { code: 'G30.0', desc: 'Doença de Alzheimer de início precoce' },
            { code: 'G30.1', desc: 'Doença de Alzheimer de início tardio' },
            { code: 'G30.8', desc: 'Outras formas de doença de Alzheimer' },
            { code: 'G31', desc: 'Outras doenças degenerativas do sistema nervoso' },
            { code: 'G31.0', desc: 'Atrofia cerebral circunscrita (demência frontotemporal)' },
            { code: 'G31.8', desc: 'Outras doenças degenerativas especificadas do sistema nervoso' },
            { code: 'G35', desc: 'Esclerose múltipla' },
            { code: 'G36', desc: 'Outras desmielinizações disseminadas agudas' },
            { code: 'G37', desc: 'Outras doenças desmielinizantes do SNC' },
            { code: 'G40', desc: 'Epilepsia' },
            { code: 'G40.0', desc: 'Epilepsia e síndromes epilépticas idiopáticas relacionadas a localização (focal)' },
            { code: 'G40.1', desc: 'Epilepsia e síndromes epilépticas sintomáticas relacionadas a localização (focal)' },
            { code: 'G40.2', desc: 'Epilepsia e síndromes epilépticas idiopáticas generalizadas' },
            { code: 'G40.3', desc: 'Epilepsia e síndromes epilépticas sintomáticas generalizadas' },

            { code: 'G54', desc: 'Transtornos das raízes e plexos nervosos' },

            { code: 'G70', desc: 'Miastenia gravis e outros transtornos neuromusculares' },
            { code: 'G70.0', desc: 'Miastenia gravis' },

            { code: 'G71.0', desc: 'Distrofia muscular' },
            { code: 'G80', desc: 'Paralisia cerebral' },
            { code: 'G91', desc: 'Hidrocefalia' },

            { code: 'M54.5', desc: 'Dor lombar baixa (lombalgia)' },
            { code: 'M79.7', desc: 'Fibromialgia' },
            { code: 'G12', desc: 'Atrofia muscular espinal e síndromes correlatas' },
            { code: 'G12.2', desc: 'Doença do neurônio motor (ELA)' },
        ];

        const searchCID10 = (query) => {
            if (!query || query.length < 2) return [];
            const q = query.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            return CID10_DATABASE.filter(item => {
                const searchStr = `${item.code} ${item.desc}`.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                return searchStr.includes(q);
            }).slice(0, 10);
        };

        // ========================================
        // Componente de Busca CID-10 (Typeahead)
        // ========================================
        const CID10Search = ({ onSelect }) => {
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [showDropdown, setShowDropdown] = useState(false);
            const inputRef = React.useRef(null);
            const dropdownRef = React.useRef(null);

            useEffect(() => {
                if (query.length >= 2) {
                    const found = searchCID10(query);
                    setResults(found);
                    setShowDropdown(found.length > 0);
                } else {
                    setResults([]);
                    setShowDropdown(false);
                }
            }, [query]);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(e.target) &&
                        inputRef.current && !inputRef.current.contains(e.target)) {
                        setShowDropdown(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const handleSelect = (item) => {
                onSelect(item);
                setQuery('');
                setResults([]);
                setShowDropdown(false);
            };

            return (
                <div style={{ position: 'relative' }}>
                    <div style={{ position: 'relative' }}>
                        <div style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: '#86868b' }}>
                            <Icons.Search />
                        </div>
                        <input
                            ref={inputRef}
                            type="text"
                            placeholder="Buscar CID-10 (ex: G43, enxaqueca...)"
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                            onFocus={() => { if (results.length > 0) setShowDropdown(true); }}
                            className="w-full p-3 pl-10 rounded-xl outline-none text-sm"
                            style={{ border: '1px solid #d2d2d7', color: '#1d1d1f', background: '#fbfbfd' }}
                        />
                    </div>
                    {showDropdown && (
                        <div
                            ref={dropdownRef}
                            style={{
                                position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 50,
                                background: '#fff', border: '1px solid #d2d2d7', borderRadius: '12px',
                                marginTop: '4px', boxShadow: '0 8px 30px rgba(0,0,0,0.12)',
                                maxHeight: '220px', overflowY: 'auto'
                            }}
                        >
                            {results.map(item => (
                                <button
                                    key={item.code}
                                    onClick={() => handleSelect(item)}
                                    className="w-full text-left px-4 py-3 transition-colors"
                                    style={{ borderBottom: '1px solid #f0f0f2', color: '#1d1d1f' }}
                                    onMouseEnter={(e) => { e.currentTarget.style.background = '#f5f5f7'; }}
                                    onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; }}
                                >
                                    <div className="flex items-center gap-2">

        // ========================================
        // Templates / Kits de Acesso Rápido
        // ========================================
        const TEMPLATE_KITS = [
            {

                label: 'Atestado Médico',
                icon: 'FileText',
                title: 'Atestado Médico',
                content: 'Atesto para os devidos fins que o(a) paciente acima identificado(a) esteve sob meus cuidados profissionais na data de hoje, necessitando de afastamento de suas atividades por ______ (______) dia(s), a partir desta data.\n\nCID: ________'

            {
                id: 'comparecimento',
                label: 'Atestado de Comparecimento',
                icon: 'Clipboard',
                title: 'Atestado de Comparecimento',
                content: 'Atesto para os devidos fins que o(a) paciente acima identificado(a) compareceu a esta clínica na data de hoje para consulta médica, permanecendo no local das ______ às ______ horas.'

                label: 'Acompanhante',
                icon: 'Clipboard',
                title: 'Atestado de Acompanhamento',

            },
        ];

        // Helper: máscara de CPF (XXX.XXX.XXX-XX)
        const formatCPF = (value) => {
            const digits = value.replace(/\D/g, '').slice(0, 11);
            if (digits.length <= 3) return digits;
            if (digits.length <= 6) return `${digits.slice(0, 3)}.${digits.slice(3)}`;
            if (digits.length <= 9) return `${digits.slice(0, 3)}.${digits.slice(3, 6)}.${digits.slice(6)}`;
            return `${digits.slice(0, 3)}.${digits.slice(3, 6)}.${digits.slice(6, 9)}-${digits.slice(9)}`;
        };

        // Helper: data formatada (suporta data personalizada para receitas pós-datadas)
        const formatDate = (hideDate, customDateStr) => {
            if (hideDate) return "_____ de ________________ de 20____";
            const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            if (customDateStr) {
                const [year, month, day] = customDateStr.split('-').map(Number);
                if (year && month && day) {
                    return `${day} de ${months[month - 1]} de ${year}`;
                }
            }
            const date = new Date();
            return `${date.getDate()} de ${months[date.getMonth()]} de ${date.getFullYear()}`;
        };

        // ========================================
        // Componente de Página de Prescrição (A4)
        // ========================================
        const PrescriptionPage = ({ meds, freeTexts: pageFreeTexts, isControlled, isSummary, via, hideDate, doctor, clinic, city, patient, forPrint, customDate }) => {
            const pageClass = forPrint ? "a4-page" : "a4-preview";

            // Extrai UF da clínica a partir do address (ex: "Brasília – DF" => "DF")
            const clinicUF = (() => {
                const match = clinic.address.match(/\b([A-Z]{2})\b/);
                return match ? match[1] : '';
            })();
            // Extrai CRM número e UF do texto do doctor.crm
            const crmParts = (() => {
                const match = doctor.crm.match(/CRM[- ]?([A-Z]{2})\s*(\d+)/i);
                return match ? { uf: match[1].toUpperCase(), num: match[2] } : { uf: '', num: doctor.crm };
            })();

            // ===== LAYOUT QUADRO RESUMO (todos os medicamentos em formato simples) =====
            if (isSummary) {

                return (
                    <div className={pageClass} style={{ fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif' }}>

                            {/* Cabeçalho */}

                                {clinic.logo ? (
                                    <React.Fragment>
                                        <img src={clinic.logo} alt={clinic.name} style={{ maxHeight: '90px', margin: '0 auto 14px auto', display: 'block' }} />
                                        <h1 style={{ fontSize: '16px', fontWeight: '600', color: '#1d1d1f', letterSpacing: '-0.01em' }}>{doctor.name}</h1>
                                        <p style={{ fontSize: '12px', color: '#6e6e73', fontWeight: '400', marginTop: '3px' }}>{doctor.specialty} | {doctor.crm}</p>
                                    </React.Fragment>
                                ) : (
                                    <React.Fragment>
                                        <h1 style={{ fontSize: '16px', fontWeight: '600', color: '#1d1d1f', letterSpacing: '-0.01em' }}>{doctor.name}</h1>
                                        <p style={{ fontSize: '12px', color: '#6e6e73', fontWeight: '400', marginTop: '3px' }}>{doctor.specialty} | {doctor.crm}</p>
                                        <p style={{ fontSize: '11px', color: '#1d1d1f', marginTop: '10px', fontWeight: '600' }}>{clinic.name}</p>

                                            <span style={{ fontWeight: '500', color: '#0071e3', fontStyle: 'italic', display: 'block', marginBottom: '3px', fontSize: '13px' }}>{med.route}</span>
                                            {med.instructions || <span style={{ color: '#d2d2d7', fontStyle: 'italic' }}>Instruções de uso...</span>}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Nota sobre controlados */}
                            {hasAnyControlled && (
                                <div style={{ marginTop: '24px', padding: '10px 14px', background: '#f5f5f7', borderRadius: '8px', fontSize: '11px', color: '#6e6e73', lineHeight: '1.5' }}>
                                    <span style={{ fontWeight: '600' }}>* Medicamento(s) sujeito(s) a controle especial.</span>{' '}
                                    Receituário de Controle Especial apresentado em separado conforme legislação vigente (Portaria SVS/MS nº 344/98).
                                </div>
                            )}
                        </div>

                        {/* Rodapé */}
                        <div style={{ marginTop: 'auto', paddingTop: '28px' }}>
                            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', marginBottom: '28px' }}>
                                <div style={{ borderTop: '1px solid #1d1d1f', width: '240px', textAlign: 'center', paddingTop: '10px' }}>
                                    <p style={{ fontWeight: '600', color: '#1d1d1f', fontSize: '13px' }}>{doctor.name}</p>
                                    <p style={{ fontSize: '11px', color: '#6e6e73', marginTop: '2px' }}>{doctor.crm}</p>
                                </div>
                                <p style={{ fontSize: '13px', color: '#6e6e73', marginTop: '16px' }}>
                                    {city}, {formatDate(hideDate, customDate)}
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            // ===== LAYOUT CONTROLADO (ANVISA) =====
            if (isControlled) {
                return (
                    <div className={pageClass} style={{ fontFamily: 'Arial, Helvetica, sans-serif', fontSize: '11px', color: '#1d1d1f', lineHeight: '1.4' }}>
                        {/* ====== SEÇÃO 1: IDENTIFICAÇÃO DO EMITENTE (topo) ====== */}
                        <div style={{ border: bx, padding: '12px 14px', marginBottom: '0' }}>
                            <div style={{ textAlign: 'center', marginBottom: '8px' }}>
                                <p style={{ fontSize: '15px', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.04em' }}>
                                    Receituário de Controle Especial
                                </p>
                                <p style={{ fontSize: '12px', fontWeight: '600', color: '#6e6e73', marginTop: '2px' }}>

                                    Identificação do Emitente
                                </p>
                                {clinic.logo && (
                                    <img src={clinic.logo} alt={clinic.name} style={{ width: '100%', maxHeight: '90px', objectFit: 'contain', marginBottom: '8px', display: 'block' }} />

                                <p style={{ fontWeight: '700', fontSize: '14px' }}>{doctor.name}</p>
                                <p style={{ fontSize: '12px', color: '#424245', marginTop: '2px' }}>{doctor.specialty}</p>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: '8px', marginTop: '6px', fontSize: '12px' }}>
                                    <div>
                                        <span style={{ fontWeight: '600' }}>CRM:</span> {crmParts.uf} {crmParts.num}
                                        {doctor.crm.includes('RQE') && (
                                            <span style={{ marginLeft: '10px' }}><span style={{ fontWeight: '600' }}>RQE:</span> {doctor.crm.split('RQE')[1].trim().replace(/^[\s,]+/, '')}</span>
                                        )}
                                    </div>
                                </div>
                                <div style={{ marginTop: '4px', fontSize: '12px' }}>
                                    <p><span style={{ fontWeight: '600' }}>Endereço:</span> {clinic.address.replace(/\n/g, ', ')}</p>
                                    <div style={{ display: 'flex', gap: '16px', marginTop: '2px' }}>
                                        <p><span style={{ fontWeight: '600' }}>Cidade:</span> {city}</p>
                                        <p><span style={{ fontWeight: '600' }}>UF:</span> {clinicUF}</p>
                                        <p><span style={{ fontWeight: '600' }}>Tel:</span> {clinic.phone}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* ====== SEÇÃO 2: PACIENTE + PRESCRIÇÃO (centro) ====== */}
                        <div style={{ border: bx, borderTop: 'none', padding: '12px', flex: 1, display: 'flex', flexDirection: 'column' }}>
                            {/* Dados do paciente */}
                            <div style={{ marginBottom: '16px' }}>
                                <p style={{ borderBottom: bx, paddingBottom: '5px', marginBottom: '8px', fontSize: '12px' }}>
                                    <span style={{ fontWeight: '600' }}>Paciente:</span>{' '}
                                    {patient.name || <span style={{ color: '#aaa' }}>____________________________________________________</span>}
                                </p>
                                <p style={{ borderBottom: bx, paddingBottom: '5px', fontSize: '11px' }}>
                                    <span style={{ fontWeight: '600' }}>Endereço:</span>{' '}
                                    {patient.address || <span style={{ color: '#aaa' }}>____________________________________________________</span>}

                            {/* Prescrição */}

                                <p style={{ fontSize: '9px', fontWeight: '700', textTransform: 'uppercase', color: '#6e6e73', letterSpacing: '0.06em', marginBottom: '10px' }}>
                                    Prescrição
                                </p>

                                    {meds.map((med, index) => (
                                        <div key={med.id || index} style={{ paddingLeft: '4px' }}>
                                            <div style={{ display: 'flex', alignItems: 'baseline', gap: '6px', marginBottom: '3px' }}>
                                                <span style={{ fontWeight: '700', fontSize: '12px' }}>{index + 1}.</span>
                                                <span style={{ fontWeight: '700', fontSize: '12px' }}>{med.name}</span>

                                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                                    <div style={{ borderTop: bx, width: '220px', textAlign: 'center', paddingTop: '8px' }}>
                                        <p style={{ fontWeight: '600', fontSize: '11px' }}>{doctor.name}</p>
                                        <p style={{ fontSize: '9px', color: '#6e6e73', marginTop: '1px' }}>{doctor.crm}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* ====== SEÇÃO 3 e 4: COMPRADOR + FORNECEDOR (rodapé) ====== */}
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', borderTop: 'none' }}>
                            {/* Identificação do Comprador */}
                            <div style={{ border: bx, borderTop: 'none', borderRight: 'none', padding: '10px 12px', fontSize: '12px' }}>
                                <p style={{ fontWeight: '700', textAlign: 'center', textTransform: 'uppercase', letterSpacing: '0.06em', borderBottom: bx, paddingBottom: '5px', marginBottom: '10px', fontSize: '10px' }}>
                                    Identificação do Comprador
                                </p>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                    <p style={{ borderBottom: '1px solid #d2d2d7', paddingBottom: '10px' }}>Nome: ___________________________________</p>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px', borderBottom: '1px solid #d2d2d7', paddingBottom: '10px' }}>
                                        <p>Ident.: _________________</p>
                                        <p>Órg. Emissor: ___________</p>
                                    </div>
                                    <p style={{ borderBottom: '1px solid #d2d2d7', paddingBottom: '10px' }}>End.: ___________________________________</p>
                                    <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 2fr', gap: '6px' }}>
                                        <p>Cidade: __________</p>
                                        <p>UF: _____</p>
                                        <p>Tel.: ___________</p>
                                    </div>
                                </div>
                            </div>

                            {/* Identificação do Fornecedor */}
                            <div style={{ border: bx, borderTop: 'none', padding: '10px 12px', fontSize: '12px', display: 'flex', flexDirection: 'column' }}>
                                <p style={{ fontWeight: '700', textAlign: 'center', textTransform: 'uppercase', letterSpacing: '0.06em', borderBottom: bx, paddingBottom: '5px', marginBottom: '10px', fontSize: '10px' }}>
                                    Identificação do Fornecedor
                                </p>
                                <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1px dashed #d2d2d7', marginBottom: '10px', minHeight: '40px' }}>
                                    <p style={{ color: '#aaa', fontStyle: 'italic', fontSize: '10px' }}>Carimbo da Farmácia</p>
                                </div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                                    <p style={{ borderBottom: '1px solid #d2d2d7', paddingBottom: '10px' }}>Assinatura do Farmacêutico: __________________</p>
                                    <p>Data: _____/_____/_________</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ===== LAYOUT PADRÃO (receita simples / texto livre) =====
            return (
                <div className={pageClass} style={{ fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif' }}>
                    <div>
                        {/* Cabeçalho */}
                        <div style={{ textAlign: 'center', borderBottom: '1.5px solid #d2d2d7', paddingBottom: '18px', marginBottom: '28px' }}>
                            {clinic.logo ? (
                                <React.Fragment>
                                    <img src={clinic.logo} alt={clinic.name} style={{ maxHeight: '90px', margin: '0 auto 14px auto', display: 'block' }} />
                                    <h1 style={{ fontSize: '16px', fontWeight: '600', color: '#1d1d1f', letterSpacing: '-0.01em' }}>{doctor.name}</h1>
                                    <p style={{ fontSize: '12px', color: '#6e6e73', fontWeight: '400', marginTop: '3px' }}>{doctor.specialty} | {doctor.crm}</p>
                                </React.Fragment>
                            ) : (
                                <React.Fragment>
                                    <h1 style={{ fontSize: '16px', fontWeight: '600', color: '#1d1d1f', letterSpacing: '-0.01em' }}>{doctor.name}</h1>
                                    <p style={{ fontSize: '12px', color: '#6e6e73', fontWeight: '400', marginTop: '3px' }}>{doctor.specialty} | {doctor.crm}</p>
                                    <p style={{ fontSize: '11px', color: '#1d1d1f', marginTop: '10px', fontWeight: '600' }}>{clinic.name}</p>
                                    <p style={{ fontSize: '10px', color: '#86868b', whiteSpace: 'pre-line', marginTop: '4px', lineHeight: '1.5' }}>{clinic.address}</p>
                                    <p style={{ fontSize: '10px', color: '#86868b', marginTop: '3px' }}>Tel: {clinic.phone}</p>
                                </React.Fragment>

                                {patient.name || <span style={{ color: '#d2d2d7', fontStyle: 'italic' }}>Nome do paciente...</span>}
                            </p>
                            {patient.cpf && (
                                <p style={{ fontSize: '13px', color: '#1d1d1f', borderBottom: '1px solid #d2d2d7', paddingBottom: '6px', marginTop: '10px' }}>

                                </p>
                            )}

                        {/* Medicamentos */}
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '22px' }}>
                            {meds.map((med, index) => (
                                <div key={med.id || index} style={{ paddingLeft: '12px' }}>
                                    <div style={{ display: 'flex', alignItems: 'baseline', gap: '8px', marginBottom: '4px' }}>
                                        <span style={{ fontWeight: '600', color: '#1d1d1f', fontSize: '16px' }}>{index + 1}.</span>
                                        <span style={{ fontWeight: '600', color: '#1d1d1f', fontSize: '16px' }}>{med.name}</span>
                                    </div>
                                    <div style={{ paddingLeft: '22px', color: '#424245', whiteSpace: 'pre-line', fontSize: '15px', lineHeight: '1.5' }}>
                                        <span style={{ fontWeight: '500', color: '#0071e3', fontStyle: 'italic', display: 'block', marginBottom: '3px', fontSize: '13px' }}>{med.route}</span>

                                    </div>
                                </div>
                            ))}
                            {meds.length === 0 && (!pageFreeTexts || pageFreeTexts.length === 0) && (

                        {/* Texto Livre */}

                            </div>
                            <p style={{ fontSize: '13px', color: '#6e6e73', marginTop: '16px' }}>

        // ========================================
        // Lógica de Geração de Páginas
        // ========================================

        // Divide o conteúdo de um texto livre em pedaços que cabem em uma página A4,
        // medindo a altura real no DOM (offscreen) e preferindo quebras em espaços/linhas.
        // Garante que páginas subsequentes mantenham o mesmo cabeçalho.
        const splitFreeTextIntoChunks = (content, hasLogo, hasCpf, hasTitle) => {
            if (!content || !content.trim()) return [content];
            if (typeof document === 'undefined' || !document.body) return [content];

            const PAGE_HEIGHT_MM = 297;
            const PAGE_PADDING_MM = 40;       // padding 20mm topo + 20mm rodapé
            const HEADER_MM = 44;             // cabeçalho (com ou sem logo) + borda inferior + margem
            const PATIENT_MM = 18 + (hasCpf ? 10 : 0);
            const TITLE_MM = hasTitle ? 10 : 0;
            const FOOTER_MM = 40;             // linha de assinatura + cidade/data + margens
            const SAFETY_MM = 6;
            const availableMm = PAGE_HEIGHT_MM - PAGE_PADDING_MM - HEADER_MM - PATIENT_MM - TITLE_MM - FOOTER_MM - SAFETY_MM;
            const PX_PER_MM = 96 / 25.4;
            const availablePx = Math.max(80, availableMm * PX_PER_MM);
            const widthPx = (210 - 40) * PX_PER_MM; // 170mm de largura útil

            const probe = document.createElement('div');
            probe.style.cssText = [
                'position:fixed', 'left:-99999px', 'top:0',
                'width:' + widthPx + 'px', 'visibility:hidden',
                'font-size:15px', 'line-height:1.6', 'color:#424245',
                'padding-left:12px', 'white-space:pre-line', 'box-sizing:border-box',
                'font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif'
            ].join(';');
            document.body.appendChild(probe);

            try {
                probe.textContent = content;
                if (probe.scrollHeight <= availablePx) return [content];

                // Tokeniza preservando whitespace/quebras de linha
                const tokens = [];
                const re = /(\s+|\S+)/g;
                let m;
                while ((m = re.exec(content)) !== null) tokens.push(m[0]);

                const chunks = [];
                let lo = 0;
                while (lo < tokens.length) {
                    // Busca binária pelo maior fim tal que tokens[lo..fim) ainda caiba
                    let low = lo + 1, high = tokens.length, best = lo + 1;
                    while (low <= high) {
                        const mid = (low + high) >> 1;
                        probe.textContent = tokens.slice(lo, mid).join('');
                        if (probe.scrollHeight <= availablePx) { best = mid; low = mid + 1; }
                        else { high = mid - 1; }
                    }
                    // Recua até a última quebra/espaço para não partir palavras
                    let breakAt = best;
                    if (breakAt < tokens.length) {
                        for (let j = breakAt - 1; j > lo; j--) {
                            if (/[\n\s]/.test(tokens[j])) { breakAt = j + 1; break; }
                        }
                    }
                    if (breakAt <= lo) breakAt = best;
                    const chunk = tokens.slice(lo, breakAt).join('').replace(/^\s+|\s+$/g, '');
                    if (chunk) chunks.push(chunk);
                    lo = breakAt;
                    while (lo < tokens.length && /^\s+$/.test(tokens[lo])) lo++;
                }
                return chunks.length > 0 ? chunks : [content];
            } finally {
                document.body.removeChild(probe);
            }
        };

        const generatePages = (medications, freeTextBlocks, separatePrescriptions, singleViaControlled, clinic, patient) => {
            const validMeds = medications.filter(m => m.name.trim() !== '');
            const validFreeTexts = (freeTextBlocks || []).filter(ft => ft.content.trim() !== '');
            const pages = [];

            if (validMeds.length === 0 && validFreeTexts.length === 0) {
                pages.push({
                    id: 'empty',
                    isControlled: false,
                    hideDate: false,
                    via: null,
                    copyIndex: 1,
                    totalCopies: 1,
                    meds: [],
                    freeTexts: [],
                    isEmpty: true
                });
                return pages;
            }

            // Agrupa por: controlado/não-controlado × com data/sem data
            const groupKeys = [];
            validMeds.forEach(med => {
                const key = `${med.isControlled ? 'C' : 'N'}_${med.hideDate ? 'H' : 'D'}`;
                if (!groupKeys.includes(key)) groupKeys.push(key);
            });

            let pageIdCounter = 0;

            // Função para dividir array em chunks
            const chunkArray = (arr, size) => {
                const chunks = [];
                for (let i = 0; i < arr.length; i += size) {
                    chunks.push(arr.slice(i, i + size));
                }
                return chunks;
            };

            groupKeys.forEach(key => {
                const isControlled = key.startsWith('C');
                const hideDate = key.endsWith('H');

                const groupMeds = validMeds.filter(
                    m => m.isControlled === isControlled && m.hideDate === hideDate
                );

                if (groupMeds.length === 0) return;

                const maxCopies = Math.max(...groupMeds.map(m => Math.max(1, parseInt(m.copies) || 1)));

                for (let copyNum = 1; copyNum <= maxCopies; copyNum++) {
                    const medsForCopy = groupMeds.filter(m => (Math.max(1, parseInt(m.copies) || 1)) >= copyNum);
                    if (medsForCopy.length === 0) continue;

                    // Determina tamanho máximo por página
                    let maxPerPage;
                    if (separatePrescriptions) {
                        maxPerPage = 1;
                    } else if (isControlled) {
                        maxPerPage = 3;
                    } else {
                        maxPerPage = medsForCopy.length; // sem limite para simples
                    }

                    const chunks = chunkArray(medsForCopy, maxPerPage);

                    chunks.forEach(chunk => {
                        if (isControlled) {
                            pages.push({
                                id: `page-${pageIdCounter++}`,
                                isControlled: true,
                                hideDate,
                                via: 1,
                                copyIndex: copyNum,
                                totalCopies: maxCopies,
                                meds: chunk,
                                freeTexts: [],
                                isEmpty: false
                            });
                            if (!singleViaControlled) {
                                pages.push({
                                    id: `page-${pageIdCounter++}`,
                                    isControlled: true,
                                    hideDate,
                                    via: 2,
                                    copyIndex: copyNum,
                                    totalCopies: maxCopies,
                                    meds: chunk,
                                    freeTexts: [],
                                    isEmpty: false
                                });
                            }
                        } else {
                            pages.push({
                                id: `page-${pageIdCounter++}`,
                                isControlled: false,
                                hideDate,
                                via: null,
                                copyIndex: copyNum,
                                totalCopies: maxCopies,
                                meds: chunk,
                                freeTexts: [],
                                isEmpty: false
                            });
                        }
                    });
                }
            });

            // Quadro resumo: se há medicamentos controlados, gera página adicional
            // com TODOS os medicamentos no formato simples, marcando os controlados com *
            const hasControlled = validMeds.some(m => m.isControlled);
            if (hasControlled && validMeds.length > 0) {
                pages.unshift({
                    id: `page-summary-${pageIdCounter++}`,
                    isControlled: false,
                    isSummary: true,
                    hideDate: false,
                    via: null,
                    copyIndex: 1,
                    totalCopies: 1,
                    meds: validMeds,
                    freeTexts: [],
                    isEmpty: false
                });
            }

            // Cada texto livre: quebra automática em múltiplas páginas se exceder uma A4.
            // Cada página gerada mantém o mesmo cabeçalho/paciente/rodapé.
            const hasLogo = !!(clinic && clinic.logo);
            const hasCpf = !!(patient && patient.cpf);
            validFreeTexts.forEach(ft => {
                const chunks = splitFreeTextIntoChunks(ft.content, hasLogo, hasCpf, !!ft.title);
                const total = chunks.length;
                chunks.forEach((chunk, idx) => {
                    pages.push({
                        id: `page-freetext-${pageIdCounter++}`,
                        isControlled: false,
                        hideDate: !!ft.hideDate,
                        via: null,
                        copyIndex: 1,
                        totalCopies: 1,
                        meds: [],
                        // Em páginas de continuação, o título só aparece na primeira
                        freeTexts: [{ ...ft, content: chunk, title: idx === 0 ? ft.title : '' }],
                        isEmpty: false,
                        ftPartIndex: idx + 1,
                        ftPartTotal: total
                    });
                });
            });

            return pages;
        };

        // ========================================
        // App Principal
        // ========================================
        // Helper: carregar do localStorage com fallback
        const loadFromStorage = (key, fallback) => {
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : fallback;
            } catch { return fallback; }
        };

        const App = () => {
            const [doctor, setDoctor] = useState(() => loadFromStorage('pr_doctor', {
                name: 'Dr. Pedro Renato P. Brandão',
                crm: 'CRM-DF 18853, RQE 11791',
                specialty: 'Médico Neurologista'
            }));

            const [selectedClinicId, setSelectedClinicId] = useState(() => loadFromStorage('pr_clinicId', 'EIXO'));
            const [city, setCity] = useState(() => loadFromStorage('pr_city', 'Brasília'));

            const [patient, setPatient] = useState({
                name: '',
                cpf: '',
                address: ''
            });

            const [medications, setMedications] = useState([
                { id: 1, route: 'Uso Oral', name: '', instructions: '', isControlled: false, hideDate: false, copies: 1 }
            ]);

            const [freeTexts, setFreeTexts] = useState([]);

            const [showDoctorSettings, setShowDoctorSettings] = useState(false);
            const [separatePrescriptions, setSeparatePrescriptions] = useState(false);
            const [singleViaControlled, setSingleViaControlled] = useState(false);

            // Data personalizada para receitas pós-datadas
            const [customDate, setCustomDate] = useState('');

            // Histórico de pacientes
            const [patientHistory, setPatientHistory] = useState(() => loadFromStorage('pr_patientHistory', []));
            const [showPatientDropdown, setShowPatientDropdown] = useState(false);
            const [patientSearchFilter, setPatientSearchFilter] = useState('');
            const patientInputRef = React.useRef(null);
            const patientDropdownRef = React.useRef(null);

            const clinic = CLINICS[selectedClinicId];

            // Auto-save: dados do médico e configurações no localStorage
            useEffect(() => {
                localStorage.setItem('pr_doctor', JSON.stringify(doctor));
            }, [doctor]);
            useEffect(() => {
                localStorage.setItem('pr_clinicId', JSON.stringify(selectedClinicId));
            }, [selectedClinicId]);
            useEffect(() => {
                localStorage.setItem('pr_city', JSON.stringify(city));
            }, [city]);

            // Auto-save: rascunho da receita atual
            useEffect(() => {
                const draft = { patient, medications, freeTexts, separatePrescriptions, singleViaControlled, customDate };
                localStorage.setItem('pr_draft', JSON.stringify(draft));
            }, [patient, medications, freeTexts, separatePrescriptions, singleViaControlled, customDate]);

            useEffect(() => {

                        if (draft.separatePrescriptions) setSeparatePrescriptions(draft.separatePrescriptions);

                        if (draft.customDate) setCustomDate(draft.customDate);
                    }

            // Salvar paciente no histórico
            const savePatientToHistory = useCallback(() => {
                if (!patient.name || patient.name.trim().length < 2) return;
                setPatientHistory(prev => {
                    const filtered = prev.filter(p => p.name.toLowerCase() !== patient.name.trim().toLowerCase());
                    const updated = [{ name: patient.name.trim(), cpf: patient.cpf.trim(), address: patient.address.trim(), lastUsed: Date.now() }, ...filtered].slice(0, 50);
                    localStorage.setItem('pr_patientHistory', JSON.stringify(updated));
                    return updated;
                });
            }, [patient]);

            // Fechar dropdown do paciente ao clicar fora
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (patientDropdownRef.current && !patientDropdownRef.current.contains(e.target) &&
                        patientInputRef.current && !patientInputRef.current.contains(e.target)) {
                        setShowPatientDropdown(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            // Filtrar histórico de pacientes
            const filteredPatientHistory = useMemo(() => {
                if (!patientSearchFilter || patientSearchFilter.length < 1) return patientHistory;
                const q = patientSearchFilter.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                return patientHistory.filter(p => {
                    const name = p.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    const cpf = (p.cpf || '').toLowerCase();
                    return name.includes(q) || cpf.includes(q);
                });
            }, [patientSearchFilter, patientHistory]);

            const selectPatientFromHistory = useCallback((p) => {
                setPatient({ name: p.name, cpf: p.cpf || '', address: p.address || '' });
                setShowPatientDropdown(false);
            }, []);

            // Gerar páginas com useMemo para evitar recalcular a cada render
            const pages = useMemo(() => generatePages(medications, freeTexts, separatePrescriptions, singleViaControlled, clinic, patient), [medications, freeTexts, separatePrescriptions, singleViaControlled, clinic, patient]);

            // Páginas para impressão (exclui vazias)
            const printPages = useMemo(() => pages.filter(p => !p.isEmpty), [pages]);

            const addMedication = useCallback(() => {
                setMedications(prev => [...prev, { 
                    id: Date.now(), route: 'Uso Oral', name: '', instructions: '', isControlled: false, hideDate: false, copies: 1 
                }]);
            }, []);

            const removeMedication = useCallback((id) => {
                setMedications(prev => prev.filter(m => m.id !== id));
            }, []);

            const addFreeText = useCallback(() => {
                setFreeTexts(prev => [...prev, { id: Date.now(), title: '', content: '', hideDate: false }]);
            }, []);

            const removeFreeText = useCallback((id) => {
                setFreeTexts(prev => prev.filter(ft => ft.id !== id));
            }, []);

            const updateFreeText = useCallback((id, field, value) => {
                setFreeTexts(prev => prev.map(ft => ft.id === id ? { ...ft, [field]: value } : ft));
            }, []);

            const updateMedication = useCallback((id, field, value) => {
                setMedications(prev => prev.map(m => m.id === id ? { ...m, [field]: value } : m));
            }, []);

            // Mover medicamento na lista
            const moveMedication = useCallback((id, direction) => {
                setMedications(prev => {
                    const idx = prev.findIndex(m => m.id === id);
                    if (idx < 0) return prev;
                    const newIdx = idx + direction;
                    if (newIdx < 0 || newIdx >= prev.length) return prev;
                    const copy = [...prev];
                    [copy[idx], copy[newIdx]] = [copy[newIdx], copy[idx]];
                    return copy;
                });
            }, []);

            const handlePrint = () => {
                savePatientToHistory();
                window.print();
            };

            // Adicionar template de texto livre
            const handleAddTemplate = useCallback((template) => {
                setFreeTexts(prev => [...prev, {
                    id: Date.now(),
                    title: template.title,
                    content: template.content,
                    hideDate: false
                }]);
            }, []);

            // Inserir CID-10 no último texto livre (ou criar um atestado com o CID)
            const handleInsertCID = useCallback((cidItem) => {
                const cidText = `${cidItem.code} - ${cidItem.desc}`;
                setFreeTexts(prev => {
                    // Se já existe um texto livre, insere o CID nele substituindo "CID: ________" ou adicionando ao final
                    if (prev.length > 0) {
                        const lastIdx = prev.length - 1;
                        const lastFt = prev[lastIdx];
                        let newContent = lastFt.content;
                        if (newContent.includes('CID: ________')) {
                            newContent = newContent.replace('CID: ________', `CID: ${cidText}`);
                        } else {
                            newContent += `\n\nCID: ${cidText}`;
                        }
                        return prev.map((ft, idx) => idx === lastIdx ? { ...ft, content: newContent } : ft);
                    }
                    // Se não existe, cria atestado padrão com o CID
                    return [...prev, {
                        id: Date.now(),
                        title: 'Atestado Médico',
                        content: `Atesto para os devidos fins que o(a) paciente acima identificado(a) esteve sob meus cuidados profissionais na data de hoje, necessitando de afastamento de suas atividades por ______ (______) dia(s), a partir desta data.\n\nCID: ${cidText}`
                    }];
                });
            }, []);

            // Limpar apenas receita (medicamentos e textos livres)
            const handleClearContent = useCallback(() => {
                setMedications([{ id: Date.now(), route: 'Uso Oral', name: '', instructions: '', isControlled: false, hideDate: false, copies: 1 }]);
                setFreeTexts([]);
                setCustomDate('');
            }, []);

            // Limpar tudo (incluindo dados do paciente)
            const handleClearAll = useCallback(() => {
                setPatient({ name: '', cpf: '', address: '' });
                setMedications([{ id: Date.now(), route: 'Uso Oral', name: '', instructions: '', isControlled: false, hideDate: false, copies: 1 }]);
                setFreeTexts([]);
                setCustomDate('');
                localStorage.removeItem('pr_draft');
            }, []);

            // Baixar PDF: clona a área de impressão em um container offscreen no tamanho A4
            // real e captura cada página com html2canvas, montando o PDF com jsPDF.
            // Isso evita problemas de escala em mobile e popups bloqueados.
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);
            const handleDownloadPDF = useCallback(async () => {
                if (isGeneratingPDF) return;
                if (typeof window.html2pdf === 'undefined') {
                    alert('Biblioteca de geração de PDF não carregada. Verifique sua conexão e recarregue a página.');
                    return;
                }
                setIsGeneratingPDF(true);
                savePatientToHistory();

                let offscreen = null;
                try {
                    if (printPages.length === 0) {
                        alert('Não há páginas para gerar.');
                        return;
                    }

                    // Nome do arquivo: prescricao_<NomePaciente>_<YYYY-MM-DD>.pdf
                    const today = new Date();
                    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
                    const patientSlug = (patient.name || 'paciente').trim().replace(/\s+/g, '_').normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    const fileName = `prescricao_${patientSlug || 'paciente'}_${dateStr}.pdf`;

                    // Cria container offscreen com fundo branco fora da viewport
                    offscreen = document.createElement('div');
                    offscreen.style.cssText = 'position:fixed;left:-99999px;top:0;background:#ffffff;z-index:-1;';
                    document.body.appendChild(offscreen);

                    // Clona a print-area (que já contém todas as páginas em tamanho A4)
                    const printArea = document.querySelector('.print-area');
                    if (!printArea) throw new Error('Área de impressão não encontrada');

                    const clone = printArea.cloneNode(true);
                    // Remove a classe "print-area" para neutralizar o display:none do @media screen
                    clone.className = '';
                    clone.style.display = 'block';
                    clone.style.position = 'static';
                    offscreen.appendChild(clone);

                    const a4Pages = clone.querySelectorAll('.a4-page');
                    if (a4Pages.length === 0) throw new Error('Nenhuma página para gerar');

                    // Força dimensões A4 reais em cada página clonada
                    a4Pages.forEach(p => {
                        p.style.width = '210mm';
                        p.style.height = '297mm';
                        p.style.minHeight = '297mm';
                        p.style.padding = '20mm';
                        p.style.margin = '0';
                        p.style.background = '#ffffff';
                        p.style.boxShadow = 'none';
                        p.style.border = 'none';
                        p.style.borderRadius = '0';
                        p.style.display = 'flex';
                        p.style.flexDirection = 'column';
                        p.style.justifyContent = 'space-between';
                        p.style.boxSizing = 'border-box';
                        p.style.pageBreakAfter = 'auto';
                        p.style.overflow = 'hidden';
                    });

                    // Aguarda um tick para o layout estabilizar
                    await new Promise(r => setTimeout(r, 80));

                    const baseOpt = {
                        margin: 0,
                        image: { type: 'jpeg', quality: 0.95 },
                        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
                    };

                    // Obtém o objeto jsPDF a partir da primeira página
                    const firstWorker = html2pdf().set(baseOpt).from(a4Pages[0]);
                    const pdf = await firstWorker.toPdf().get('pdf');
                    const pdfW = pdf.internal.pageSize.getWidth();
                    const pdfH = pdf.internal.pageSize.getHeight();

                    // Adiciona as demais páginas (capturadas como canvas).
                    // Em html2pdf 0.10.x, toCanvas() resolve com o próprio Worker;
                    // o canvas é exposto via .get('canvas') ou em worker.prop.canvas.
                    for (let i = 1; i < a4Pages.length; i++) {
                        const w = html2pdf().set(baseOpt).from(a4Pages[i]);
                        await w.toCanvas();
                        const canvas = (w.prop && w.prop.canvas)
                            || (await w.get('canvas'));
                        if (!canvas || typeof canvas.toDataURL !== 'function') {
                            throw new Error('Falha ao renderizar a página ' + (i + 1));
                        }
                        const imgData = canvas.toDataURL('image/jpeg', 0.95);
                        pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
                    }

                    // Dispara o download diretamente (jsPDF cuida do blob/link)
                    pdf.save(fileName);
                } catch (err) {
                    console.error('Erro ao gerar PDF:', err);
                    alert('Erro ao gerar PDF: ' + (err && err.message ? err.message : err));
                } finally {
                    if (offscreen && offscreen.parentNode) offscreen.parentNode.removeChild(offscreen);
                    setIsGeneratingPDF(false);
                }
            }, [printPages, patient, isGeneratingPDF]);

            // Descrição de cada página para o banner do preview
            const getPageLabel = (page) => {
                if (page.isSummary) {
                    return 'Quadro Resumo — Todos os Medicamentos';
                }
                if (page.freeTexts && page.freeTexts.length > 0 && page.meds.length === 0) {
                    let label = 'Texto Livre';
                    if (page.ftPartTotal && page.ftPartTotal > 1) {
                        label += ` (página ${page.ftPartIndex} de ${page.ftPartTotal})`;
                    }
                    return label;
                }
                let label = page.isControlled
                    ? `Controle Especial - ${page.via}ª Via`
                    : 'Receituário Simples';
                if (page.totalCopies > 1) label += ` (Cópia ${page.copyIndex}/${page.totalCopies})`;
                if (page.hideDate) label += ' — Sem Data';
                return label;
            };

            return (
                <React.Fragment>
                    <div className="flex flex-col md:flex-row md:h-screen md:overflow-hidden no-print">

                        {/* COLUNA ESQUERDA: INTERFACE DE CONTROLE */}
                        <div className="w-full md:w-[440px] flex flex-col md:h-full border-b md:border-b-0 md:border-r shrink-0" style={{ background: 'rgba(255,255,255,0.72)', backdropFilter: 'saturate(180%) blur(20px)', WebkitBackdropFilter: 'saturate(180%) blur(20px)', borderColor: '#d2d2d7' }}>

                            {/* Header */}
                            <div className="px-6 py-5 flex justify-between items-center" style={{ borderBottom: '1px solid #d2d2d7' }}>
                                <div>
                                    <h1 className="text-xl font-semibold tracking-tight" style={{ color: '#1d1d1f', letterSpacing: '-0.02em' }}>Prescritor Digital</h1>
                                    <p className="text-xs mt-0.5" style={{ color: '#6e6e73' }}>Simples e prático</p>
                                </div>
                                <button
                                    onClick={() => setShowDoctorSettings(!showDoctorSettings)}
                                    className="p-2.5 rounded-full transition-all"
                                    style={{ background: showDoctorSettings ? '#e8e8ed' : 'transparent', color: '#1d1d1f' }}
                                    title="Configurar Médico"
                                >
                                    <Icons.Settings />
                                </button>
                            </div>

                            {/* Corpo */}
                            <div className="flex-1 overflow-y-auto px-6 py-5 hide-scrollbar space-y-6">

                                {/* Configurações do Médico */}
                                {showDoctorSettings && (
                                    <div className="p-5 rounded-2xl space-y-4 mb-2" style={{ background: '#f5f5f7', border: '1px solid #e8e8ed' }}>

                            <div className="max-w-4xl mx-auto space-y-8">

                                <div className="p-4 rounded-2xl text-sm flex items-start gap-3" style={{ background: '#fbfbfd', border: '1px solid #d2d2d7', color: '#1d1d1f' }}>
                                    <div className="mt-0.5" style={{ fontSize: '16px' }}>ℹ️</div>
                                    <div>
                                        <p className="font-semibold" style={{ color: '#1d1d1f' }}>Lógica de Impressão Automática</p>
                                        <p style={{ color: '#6e6e73', marginTop: '2px' }}>As páginas abaixo refletem exatamente o que sairá na impressora. Medicamentos são agrupados por tipo (simples vs. controlado) e por presença de data. Medicamentos controlados geram 1ª e 2ª via automaticamente.</p>
                                    </div>
                                </div>

                                {pages.map((page) => (
                                    <div key={page.id}>
                                        {!page.isEmpty && (
                                            <h3 className="font-medium mb-3 text-center text-xs uppercase mt-8" style={{ color: '#86868b', letterSpacing: '0.06em' }}>
                                                {getPageLabel(page)}
                                            </h3>
                                        )}
                                        <PrescriptionPage
                                            meds={page.meds}
                                            freeTexts={page.freeTexts}
                                            isControlled={page.isControlled}
                                            isSummary={page.isSummary}
                                            via={page.via}
                                            hideDate={page.hideDate}
                                            doctor={doctor}
                                            clinic={clinic}
                                            city={city}
                                            patient={patient}
                                            customDate={customDate}
                                            forPrint={false}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* ============================================ */}
                    {/* ÁREA DE IMPRESSÃO — invisível na tela,       */}
                    {/* visível somente em @media print               */}
                    {/* ============================================ */}
                    <div className="print-area">
                        {printPages.map(page => (
                            <PrescriptionPage
                                key={`print-${page.id}`}
                                meds={page.meds}
                                freeTexts={page.freeTexts}
                                isControlled={page.isControlled}
                                isSummary={page.isSummary}
                                via={page.via}
                                hideDate={page.hideDate}
                                doctor={doctor}
                                clinic={clinic}
                                city={city}
                                patient={patient}
                                customDate={customDate}
                                forPrint={true}
                            />
                        ))}
                    </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
